<title>O2C Collections Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: white navigation rail + scoped workspace; worklist with a detail drawer; one unified approval inbox. */
:root {
  --canvas: #f7f8fa; --surface: #ffffff; --surface-muted: #eef1f5; --ink: #0b1220; --brand: #0b1220; --muted: #566072; --border: #e3e7ed;
  --primary: #11736a; --primary-hover: #0c5e57; --primary-soft: #e3f2f0; --on-primary: #ffffff; --teal: #11736a; --teal-soft: #e3f2f0;
  --info: #1e3a5f; --info-soft: #e8edf4;
  --success: #146b50; --success-soft: #e8f6ef; --warning: #865410; --warning-soft: #fff4dc; --danger: #b12e47; --danger-soft: #fdebf0;
  --paper: #ffffff; --paper-ink: #0b1220; --scrim: rgba(11,18,32,.32); --shadow: rgba(11,18,32,.14);
  --font-body: "Geist", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Space Grotesk", "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-money: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #0b0f17; --surface: #111827; --surface-muted: #1a2233; --ink: #e6eaf0; --brand: #e6eaf0; --muted: #9aa4b5; --border: #243044;
  --primary: #3fb8a8; --primary-hover: #5ccabb; --primary-soft: #12302d; --on-primary: #0b0f17; --teal: #3fb8a8; --teal-soft: #12302d;
  --info: #a9c1e0; --info-soft: #1b2a40;
  --success: #6fd3a8; --success-soft: #16332a; --warning: #f0c06a; --warning-soft: #3a2f17; --danger: #f08a9e; --danger-soft: #3d1e27;
  --paper: #ffffff; --paper-ink: #0b1220; --scrim: rgba(0,0,0,.55); --shadow: rgba(0,0,0,.5); color-scheme: dark } }
:root[data-theme="dark"] {
  --canvas: #0b0f17; --surface: #111827; --surface-muted: #1a2233; --ink: #e6eaf0; --brand: #e6eaf0; --muted: #9aa4b5; --border: #243044;
  --primary: #3fb8a8; --primary-hover: #5ccabb; --primary-soft: #12302d; --on-primary: #0b0f17; --teal: #3fb8a8; --teal-soft: #12302d;
  --info: #a9c1e0; --info-soft: #1b2a40;
  --success: #6fd3a8; --success-soft: #16332a; --warning: #f0c06a; --warning-soft: #3a2f17; --danger: #f08a9e; --danger-soft: #3d1e27;
  --paper: #ffffff; --paper-ink: #0b1220; --scrim: rgba(0,0,0,.55); --shadow: rgba(0,0,0,.5); color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--canvas); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5 }
h1, h2, h3 { font-family: var(--font-head); font-weight: 600; margin: 0; text-wrap: balance }
h1 { font-size: 26px; letter-spacing: -.01em } h2 { font-size: 16px } h3 { font-size: 14px }
p { margin: 0 }
.money, .num { font-family: var(--font-money); font-variant-numeric: tabular-nums; white-space: nowrap }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px }
.muted { color: var(--muted) } .small { font-size: 12px }
.proto-banner { background: var(--teal-soft); color: var(--teal); font-size: 12px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between }
.proto-banner strong { font-weight: 600 }
.role-switch { display: inline-flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px }
.role-switch button { border: 0; background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted) }
.role-switch button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary) }
.app { display: grid; grid-template-columns: 236px minmax(0,1fr); min-height: calc(100% - 37px) }
.rail { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-family: var(--font-head); font-size: 18px }
.brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 13px }
.nav-group { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px }
.nav-item { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 10px; border-radius: 12px; border: 0; background: transparent; text-align: start; width: 100%; color: var(--muted) }
.nav-item:hover { background: var(--surface-muted); color: var(--ink) }
.nav-item[aria-current="page"] { background: var(--primary-soft); color: var(--primary); font-weight: 600 }
.nav-item .count { margin-inline-start: auto; background: var(--primary); color: var(--on-primary); border-radius: 999px; font-size: 11px; padding: 0 7px; font-weight: 600 }
.ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.main { min-width: 0; display: flex; flex-direction: column }
.topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: var(--surface); border-bottom: 1px solid var(--border); padding-block: 12px; padding-inline: 28px }
.scope { display: flex; flex-direction: column } .scope b { font-weight: 600 }
.cmdk { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 260px; max-width: 420px; height: 40px; border: 1px solid var(--border); border-radius: 12px; background: var(--canvas); padding: 0 12px; color: var(--muted); text-align: start }
.cmdk kbd { margin-inline-start: auto; font-family: var(--font-money); font-size: 11px; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; background: var(--surface) }
.content { padding-block: 24px 48px; padding-inline: 28px; display: flex; flex-direction: column; gap: 20px; max-width: 1480px; width: 100% }
.page-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-end }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 14px; border: 1px solid transparent; background: var(--primary); color: var(--on-primary); font-weight: 600 }
.btn:hover { background: var(--primary-hover) }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--border) }
.btn.secondary:hover { background: var(--surface-muted) }
.btn.ghost { background: transparent; color: var(--primary); border-color: transparent; min-height: 36px; padding: 6px 10px }
.btn.danger { background: var(--surface); color: var(--danger); border-color: var(--border) }
.btn:disabled { opacity: .5; cursor: not-allowed }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; min-width: 0 }
.panel-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border) }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px }
.kpi .value { font-size: 22px; font-family: var(--font-money) }
.kpi .note { font-size: 12px; color: var(--muted) }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 500; white-space: nowrap }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.pill.ok { background: var(--success-soft); color: var(--success) } .pill.warn { background: var(--warning-soft); color: var(--warning) }
.pill.bad { background: var(--danger-soft); color: var(--danger) } .pill.info { background: var(--primary-soft); color: var(--primary) }
.pill.neutral { background: var(--surface-muted); color: var(--muted) } .pill.ai { background: var(--teal-soft); color: var(--teal) }
.split { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); gap: 20px; align-items: start }
.table-wrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse }
th { text-align: start; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); background: var(--surface-muted); padding: 10px 14px; font-weight: 600 }
td { padding: 12px 14px; border-top: 1px solid var(--border); vertical-align: middle }
th.r, td.r { text-align: end }
tr.row-btn { cursor: pointer } tr.row-btn:hover td { background: var(--surface-muted) }
tr.row-btn[aria-selected="true"] td { background: var(--primary-soft) }
.cust-name { font-weight: 600 } .cust-sub { font-size: 12px; color: var(--muted) }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px }
.drawer { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px }
.hold { display: flex; gap: 10px; align-items: flex-start; background: var(--danger-soft); color: var(--danger); border-radius: 14px; padding: 12px 14px }
.section-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px }
.contact { display: flex; justify-content: space-between; gap: 8px; align-items: center; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px }
.draft { border: 1px solid var(--border); border-radius: 14px; overflow: hidden }
.draft-head { background: var(--surface-muted); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center }
.draft-body { padding: 12px; white-space: pre-wrap; line-height: 1.6 }
.locked { background: var(--canvas); border: 1px dashed var(--border); border-radius: 10px; padding: 8px 10px; margin: 8px 0; font-family: var(--font-money); font-size: 12px }
.tone { display: inline-flex; gap: 4px; flex-wrap: wrap }
.tone button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px }
.tone button[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); background: var(--primary-soft) }
.actions { display: flex; flex-wrap: wrap; gap: 8px }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 12px; border-bottom: 1px solid var(--border) }
.tab { border: 0; background: transparent; padding: 12px 10px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap }
.tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600 }
.list { display: flex; flex-direction: column }
.list-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--border) }
.list-row:first-child { border-top: 0 }
.empty { padding: 32px 20px; text-align: center; color: var(--muted) }
.card-stack { display: flex; flex-direction: column; gap: 14px; padding: 16px }
.appr { border: 1px solid var(--border); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--surface) }
.appr-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between }
.impact { background: var(--surface-muted); border-radius: 12px; padding: 10px 12px; font-size: 13px }
.impact b { font-weight: 600 }
.ack { display: flex; gap: 10px; align-items: flex-start; font-size: 13px }
.ack input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--primary) }
.filters { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 12px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.limit-bar { height: 8px; background: var(--surface-muted); border-radius: 999px; overflow: hidden; margin-top: 8px }
.limit-bar span { display: block; height: 100%; background: var(--warning) }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px }
.stat { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px }
.timeline { list-style: none; margin: 0; padding: 0 20px 16px; display: flex; flex-direction: column }
.timeline li { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border) }
.timeline li:first-child { border-top: 0 }
.pdf-stage { background: var(--surface-muted); padding: 20px; display: flex; justify-content: center; overflow-x: auto }
.pdf { background: var(--paper); color: var(--paper-ink); width: 595px; min-width: 595px; padding: 36px 40px; box-shadow: 0 6px 24px rgba(20,24,40,.12); font-size: 11px; border-radius: 4px }
.pdf h4 { font-family: var(--font-head); font-size: 16px; margin: 0 }
.pdf table th { background: #f1f2f8; color: #626c80; font-size: 9px; padding: 6px 8px }
.pdf table td { border-top: 1px solid #e4e7ef; padding: 6px 8px; font-size: 10px }
.pdf .ag { display: grid; grid-template-columns: repeat(6,1fr); gap: 4px; margin-top: 14px }
.pdf .ag div { background: #f6f7fb; border-radius: 4px; padding: 6px; font-size: 9px }
.pdf .ag b { display: block; font-family: var(--font-money); font-size: 10px; margin-top: 2px }
.agents { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px }
.agent { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px }
.step { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border) }
.step:first-child { border-top: 0 }
.step .dot { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; flex: none; background: var(--surface-muted); color: var(--muted); font-size: 11px }
.step.find .dot { background: var(--warning-soft); color: var(--warning) } .step.prop .dot { background: var(--primary-soft); color: var(--primary) } .step.post .dot { background: var(--success-soft); color: var(--success) }
.chat { display: flex; flex-direction: column; gap: 12px; padding: 18px }
.bubble { max-width: 640px; border-radius: 16px; padding: 12px 14px; line-height: 1.6 }
.bubble.user { align-self: flex-end; background: var(--primary); color: var(--on-primary) }
.bubble.ai { background: var(--surface); border: 1px solid var(--border) }
.cite { display: inline-flex; gap: 4px; align-items: center; background: var(--primary-soft); color: var(--primary); border-radius: 8px; padding: 1px 7px; font-size: 12px; border: 0 }
.followups { display: flex; flex-wrap: wrap; gap: 6px }
.toast { position: fixed; z-index: 30; inset-inline-end: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); border-radius: 14px; padding: 12px 16px; max-width: min(420px, calc(100vw - 40px)); box-shadow: 0 10px 30px rgba(0,0,0,.2) }
.modal-scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding: calc(80px + env(safe-area-inset-top, 0px)) 16px 16px }
.modal { width: min(560px, 100%); background: var(--surface); border-radius: 18px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.25) }
.modal input { width: 100%; border: 0; border-bottom: 1px solid var(--border); padding: 16px 18px; background: transparent; font-size: 15px }
.modal input:focus-visible { outline: none }
.cmd-row { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: transparent; padding: 10px 18px; text-align: start }
.cmd-row:hover, .cmd-row:focus-visible { background: var(--surface-muted); outline: none }
.mobile-nav { display: none }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 500 }
label.f input, label.f select { min-height: 44px; border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; background: var(--surface) }
@media (max-width: 1100px) { .agents { grid-template-columns: repeat(2, minmax(0,1fr)) } .kpis { grid-template-columns: repeat(2, minmax(0,1fr)) } .split { grid-template-columns: minmax(0,1fr) } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0,1fr) }
  .rail { display: none }
  .mobile-nav { display: flex; position: sticky; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--border); padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); justify-content: space-around }
  .mobile-nav button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); min-height: 44px; min-width: 56px }
  .mobile-nav button[aria-current="page"] { color: var(--primary); font-weight: 600 }
  .topbar, .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .agents, .grid2, .form-grid { grid-template-columns: minmax(0,1fr) }
  .timeline li { grid-template-columns: minmax(0,1fr) }
  .hide-sm { display: none }
}
/* Agent operations */
.ops-grid { display: grid; grid-template-columns: minmax(0,320px) minmax(0,1fr); gap: 20px; align-items: stretch }
.gauge-card { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px }
.gauge-legend { width: 100%; display: grid; gap: 6px; font-size: 12px }
.gauge-legend div { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--border); padding-top: 6px }
.map-wrap { overflow-x: auto; padding: 8px 12px 4px }
.map-wrap svg { display: block; min-width: 620px; width: 100%; height: auto }
.map-node rect { fill: var(--surface); stroke: var(--border); stroke-width: 1.5 }
.map-node.agent rect { stroke: var(--primary) }
.map-node.warn rect { stroke: var(--warning); stroke-width: 2.5 }
.map-node.road rect { fill: var(--surface-muted); stroke-dasharray: 5 4 }
.map-node text { fill: var(--ink); font-family: var(--font-body); font-size: 12px }
.map-node .sub { fill: var(--muted); font-size: 10.5px }
.map-node.road text { fill: var(--muted) }
.map-edge { fill: none; stroke: var(--muted); opacity: .55 }
.map-edge.bad { stroke: var(--danger); opacity: .9 }
.map-edge.road { stroke-dasharray: 4 5; opacity: .35 }
.edge-hit { fill: none; stroke: transparent; stroke-width: 18; cursor: pointer }
.edge-hit:focus-visible { stroke: var(--primary-soft) }
.edge-label { fill: var(--muted); font-size: 10.5px; font-family: var(--font-money) }
.edge-label.bad { fill: var(--danger) }
.flow-dot { fill: var(--teal) }
.pulse-ring { fill: none; stroke: var(--teal); stroke-width: 2; opacity: 0 }
.stream { font-family: var(--font-money); font-size: 12px; display: flex; flex-direction: column; gap: 4px; padding: 12px 20px 16px; border-top: 1px solid var(--border) }
.stream div { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted) } .stream b { color: var(--ink); font-weight: 500 }
.cmp td:last-child { white-space: nowrap }
.cmp td { padding: 10px 12px } .cmp .num { font-size: 13px }
.callout { border-inline-start: 3px solid var(--danger); background: var(--danger-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 13px }
.steps { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 20px 0 }
.steps span { font-size: 12px; border-radius: 999px; padding: 4px 10px; background: var(--surface-muted); color: var(--muted) }
.steps span[aria-current="step"] { background: var(--primary); color: var(--on-primary) }
.sim { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px }
.sim div { border: 1px solid var(--border); border-radius: 14px; padding: 12px }
.sim b { display: block; font-family: var(--font-money); font-size: 20px; margin-top: 4px }
.stage-track { display: flex; gap: 4px; flex-wrap: wrap }
.stage-track span { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-muted); color: var(--muted) }
.stage-track span.on { background: var(--primary-soft); color: var(--primary); font-weight: 600 }
.bars { display: flex; flex-direction: column; gap: 10px; padding: 16px 20px }
.bar-row { display: grid; grid-template-columns: 140px minmax(0,1fr) 90px; gap: 10px; align-items: center; font-size: 13px }
.bar-track { height: 10px; background: var(--surface-muted); border-radius: 999px; overflow: hidden }
.bar-track span { display: block; height: 100%; background: var(--primary); border-radius: 999px }
.trace { list-style: none; margin: 0; padding: 8px 20px 16px }
.trace li { display: grid; grid-template-columns: 70px 20px minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--border) }
.trace li:first-child { border-top: 0 }
.trace .t { font-family: var(--font-money); font-size: 11px; color: var(--muted); padding-top: 2px }
.trace .k { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); margin-top: 5px }
.trace .k.tool { background: var(--primary) } .trace .k.ok { background: var(--success) } .trace .k.bad { background: var(--danger) } .trace .k.hum { background: var(--teal) }
.dock-btn { position: fixed; z-index: 15; inset-inline-end: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); border-radius: 999px; box-shadow: 0 8px 24px rgba(20,24,40,.18) }

/* A3 theme and type: navy ink, one teal action colour, Geist / Space Grotesk / JetBrains Mono, 8px grid, flat surfaces. */

.money, .num, td.r, .kpi .value, .sim b { font-variant-numeric: tabular-nums }

.nav-item .count { background: var(--ink); color: var(--surface) }
.mobile-nav button[aria-current="page"] { color: var(--ink) }
.proto-banner { background: var(--info-soft); color: var(--info) }

tr.row-btn[aria-selected="true"] td { background: var(--surface-muted) }

.topbar { position: sticky; top: 0; z-index: 12; background: var(--surface); padding-inline: 32px; padding-block: 16px }

.btn, .cmdk, .contact, .draft, .hold, .impact, .locked, .callout, .tabs + * .stat { border-radius: 8px }

td { padding: 12px 16px } th { padding: 8px 16px }

<script>
(() => {
const ICONS = {

  trace: '<path d="M4 6h10M4 12h16M4 18h7"/><circle cx="17" cy="6" r="2"/><circle cx="14" cy="18" r="2"/>',

  shield: '<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
};
const icon = (name) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
const NAV = [
  { group: "Operations", items: [["ops","Overview","pulse"],["map","Agent map","map"],["traces","Traces","trace"],["incidents","Incidents","bell"],["guardrails","Guardrails","shield"],["insights","Insights","spark"]] },
  { group: "Work", items: [["collections","Collections","coll"],["customer","Customers","cust"],["cash","Cash application","cash"],["inbox","Approvals","inbox"]] },
  { group: "AI", items: [["agents","Agent console","bot"],["copilot","Copilot","chat"]] },
  { group: "Insight", items: [["reports","Reports","chart"]] },
  { group: "Records", items: [["ledger","Receivables ledger","ledger"]] },
];
const MOBILE = [["ops","Ops","pulse"],["collections","Collect","coll"],["inbox","Approve","inbox"],["incidents","Alerts","bell"]];

// ---- Prototype data (examples only) ----
const fmt = (s) => { const [i, f] = s.split("."); return "AED " + i.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + f; };
const customers = [
  { id: "c1", name: "Al Noor Building Materials", acct: "CUS-1042", overdue: "184250.00", open: "212900.50", days: 97, stage: "final_notice", flags: ["Promise broken"], limit: "250000.00", hold: true,
    contacts: [{ name: "Reem Haddad", email: "ar@alnoor.example", role: "AR", primary: true }],
    invoices: [["INV-23081","2026-06-30","96000.00","Overdue 107d",""],["INV-23214","2026-07-31","88250.00","Overdue 76d","Promise broken"],["INV-23560","2026-10-31","28650.50","Current",""]] },
  { id: "c2", name: "Marina Hospitality Group", acct: "CUS-0877", overdue: "96400.00", open: "141400.00", days: 54, stage: "firm", flags: ["Dispute open"], limit: "300000.00", hold: false,
    contacts: [{ name: "Accounts payable", email: "ap@marinahg.example", role: "AP", primary: true }],
    invoices: [["INV-23190","2026-08-21","52400.00","Overdue 55d","Dispute open"],["INV-23302","2026-09-10","44000.00","Overdue 35d",""],["INV-23611","2026-11-05","45000.00","Current",""]] },
  { id: "c3", name: "Desert Rose Clinics", acct: "CUS-1288", overdue: "31775.25", open: "31775.25", days: 18, stage: "reminder", flags: ["Promise 20/10"], limit: "80000.00", hold: false,
    contacts: [],
    invoices: [["INV-23477","2026-09-27","31775.25","Overdue 18d","Promise 20/10/2026"]] },
];
const state = { view: "ops", edge: "col-out", gStep: 1, gKind: "require_contact", simulated: false, dock: false, role: "maker", selected: "c1", custTab: "overview", tone: "final_notice", inboxFilter: "all", outboxTab: "pending", submitted: false, sent: false, holdReleased: false };
const outbox = [];
const approvals = [
  { id: "a1", type: "Cash", maker: "ai", title: "Allocate receipt FT26-88412 to INV-23302", amount: "44000.00", evidence: "Bank reference INV-23302 equals invoice number; amount equals open balance.", impact: "Debit unapplied cash / credit accounts receivable", status: "pending" },
  { id: "a2", type: "Credit limit", maker: "sara", title: "Raise Desert Rose Clinics limit", amount: "120000.00", evidence: "Twelve months on time; signed PO pipeline AED 95k.", impact: "Limit AED 80,000.00 → AED 120,000.00", status: "pending" },
];
const nameOf = (m) => m === "ai" ? "AI agent" : m === "sara" ? "Sara (controller)" : m === "you-maker" ? "You (controller)" : "Omar (AR manager)";

const flagPill = (f) => `<span class="pill ${/broken|Dispute/.test(f) ? (/Dispute/.test(f) ? "warn" : "bad") : "neutral"}">${f}</span>`;

function toast(msg) { const host = document.getElementById("toast-host"); host.innerHTML = `<div class="toast" role="status">${msg}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => host.innerHTML = "", 3600); }
function nav() {

  document.getElementById("rail").innerHTML = `<div class="brand"><span class="brand-mark">o2c</span>Command Center</div>` + NAV.map(g => `<div class="nav-group">${g.group}</div>` + g.items.map(([id, label, ic]) =>
    `<button type="button" class="nav-item" data-go="${id}" ${state.view === id ? 'aria-current="page"' : ""}>${icon(ic)}<span>${label}</span>${id === "inbox" && pending ? `<span class="count" aria-label="${pending} pending">${pending}</span>` : ""}</button>`).join("")).join("");
  document.getElementById("mobile-nav").innerHTML = MOBILE.map(([id, label, ic]) => `<button type="button" data-go="${id}" ${state.view === id ? 'aria-current="page"' : ""}>${icon(ic)}${label}${id === "inbox" && pending ? ` (${pending})` : ""}</button>`).join("");
  document.getElementById("who").textContent = state.role === "maker" ? "Sara Al Mansoori · Credit controller" : "Omar Khalid · AR manager";
}

// ---- Views ----
function viewCollections() {
  const c = customers.find(x => x.id === state.selected);
  const draftLines = c.invoices.filter(i => /Overdue/.test(i[3]) && !/Dispute/.test(i[4]));
  const draftTotal = draftLines.reduce((s, i) => s + Math.round(parseFloat(i[2]) * 100), 0); // prototype display only
  const total = (draftTotal / 100).toFixed(2);
  const toneText = { reminder: "This is a friendly reminder that the invoices below are past due.", firm: "Several invoices on your account are now significantly overdue and require your attention.", final_notice: "Despite earlier reminders, the invoices below remain unpaid. Please arrange payment within 7 days or contact us to agree a schedule." }[state.tone];
  const pendingCount = outbox.filter(m => m.status === "pending").length;
  return `
  <div class="page-head"><div><p class="eyebrow">Work / Collections</p><h1>Collections</h1><p class="muted">Ranked by overdue AED and age. The collections agent refreshed this list at 08:00 GST.</p></div>
    <div class="actions"><button type="button" class="btn secondary" data-toast="Collections agent queued. Steps stream in AI agents.">${icon("bot")}Run collections agent</button></div></div>
  <section class="kpis" aria-label="Collections summary">
    <div class="kpi"><span class="muted small">Overdue AR</span><span class="value"><span class="ccy">AED</span> 312,425.25</span><span class="note">3 customers · 6 invoices</span></div>
    <div class="kpi"><span class="muted small">Broken promises</span><span class="value">1</span><span class="note">AED 88,250.00 promised by 30/09</span></div>
    <div class="kpi"><span class="muted small">Open disputes</span><span class="value">1</span><span class="note">Excluded from dunning and auto-match</span></div>
    <div class="kpi"><span class="muted small">Emails awaiting approval</span><span class="value">${pendingCount}</span><span class="note">${pendingCount ? "Needs an AR manager" : "Outbox clear"}</span></div>
  </section>
  <div class="split">
    <section class="panel" aria-labelledby="wl-h">
      <div class="panel-head"><h2 id="wl-h">Worklist</h2><div class="filters" role="group" aria-label="Filter worklist"><button class="chip" aria-pressed="true" type="button">All</button><button class="chip" aria-pressed="false" type="button">Broken promises</button><button class="chip" aria-pressed="false" type="button">On hold</button></div></div>
      <div class="table-wrap"><table><thead><tr><th>Customer</th><th class="r">Overdue</th><th class="r hide-sm">Oldest</th><th>Next step</th></tr></thead><tbody>
      ${customers.map(x => `<tr class="row-btn" tabindex="0" data-select="${x.id}" aria-selected="${x.id === state.selected}"><td><div class="cust-name">${x.name}</div><div class="cust-sub">${x.acct}</div><div class="badges">${x.flags.map(flagPill).join("")}${x.hold && !state.holdReleased ? '<span class="pill bad">On hold</span>' : ""}</div></td><td class="r money">${fmt(x.overdue)}</td><td class="r num hide-sm">${x.days}d</td><td>${pillFor(x.stage)}</td></tr>`).join("")}
      </tbody></table></div>
    </section>
    <section class="panel" aria-labelledby="dr-h">
      <div class="drawer">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2 id="dr-h">${c.name}</h2><p class="small muted">${c.acct} · open <span class="money">${fmt(c.open)}</span></p></div><button type="button" class="btn ghost" data-go="customer">Open account →</button></div>
        ${c.hold && !state.holdReleased ? `<div class="hold" role="status">${icon("warn")}<div><b>Credit hold active.</b> Placed by the credit risk agent on 14/10/2026: 90+ days overdue. Only an AR manager can release it.</div></div>` : ""}
        <div><p class="section-label">Contacts</p>${c.contacts.length ? c.contacts.map(k => `<div class="contact"><div><b>${k.name}</b> ${k.primary ? '<span class="pill info">Primary</span>' : ""}<div class="small muted">${k.email} · ${k.role}</div></div><button class="btn ghost" type="button">Edit</button></div>`).join("") : `<div class="contact"><span class="muted">No AR contact on file. The agent cannot draft an email until someone adds one.</span><button class="btn secondary" type="button" data-toast="Contact form opens here (email validated, never filled by AI).">Add contact</button></div>`}</div>
        ${c.contacts.length ? `<div class="draft">
          <div class="draft-head"><span><span class="pill ai">AI draft</span> <span class="small muted">from collections agent run · 08:02</span></span>
            <span class="tone" role="group" aria-label="Tone">${["reminder","firm","final_notice"].map(t => `<button type="button" data-tone="${t}" aria-pressed="${state.tone === t}">${t === "final_notice" ? "Final notice" : t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</span></div>
          <div class="draft-body"><b>To:</b> ${c.contacts[0].email}
<b>Subject:</b> ${state.tone === "final_notice" ? "Final notice" : "Payment reminder"}: ${c.acct} overdue ${fmt(total)}

Dear ${c.contacts[0].name},

${toneText}
<div class="locked" aria-label="Invoice lines locked to ledger">${draftLines.map(i => `${i[0]}   due ${i[1].split("-").reverse().join("/")}   ${fmt(i[2])}`).join("<br>")}<br><b>Total overdue ${fmt(total)}</b> · locked to ledger</div>Please confirm your payment date, or tell us if anything is in dispute.

Accounts Receivable</div>
          <div class="draft-head" style="border-top:1px solid var(--border)"><label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="attach-soa" checked> Attach statement of account (PDF)</label>

    <div class="list">${outbox.filter(m => m.status === state.outboxTab).map(m => `<div class="list-row"><div><b>${m.subject}</b><div class="small muted">To ${m.to} · maker ${nameOf(m.maker)}${m.providerId ? ` · Resend id <span class="num">${m.providerId}</span>` : ""}</div></div><span class="money">${fmt(m.amount)}</span></div>`).join("") || `<p class="empty">Nothing here yet.</p>`}</div>

function viewInbox() {
  const items = [...outbox.filter(m => m.status === "pending").map(m => ({ id: m.id, type: "Email", maker: m.maker, title: m.subject, amount: m.amount, evidence: `Locked lines: ${m.lines}. Statement attached: ${m.attach ? "yes" : "no"}.`, impact: `Sends to ${m.to} through Resend`, status: "pending", email: true })), ...approvals.filter(a => a.status === "pending")];
  if (!state.holdReleased) items.push({ id: "h1", type: "Hold release", maker: "ai", title: "Credit hold on Al Noor Building Materials", amount: "184250.00", evidence: "Placed automatically: invoices over 90 days overdue. Release only after a payment plan is agreed.", impact: "Customer returns to normal credit status", status: "pending", hold: true });
  const shown = items.filter(i => state.inboxFilter === "all" || i.type === state.inboxFilter);
  const types = ["all", "Email", "Cash", "Credit limit", "Hold release"];
  return `
  <div class="page-head"><div><p class="eyebrow">Work / Approvals</p><h1>Approvals</h1><p class="muted">One inbox for everything that needs an independent checker.</p></div></div>
  <div class="filters" role="group" aria-label="Filter approvals">${types.map(t => `<button class="chip" type="button" data-filter="${t}" aria-pressed="${state.inboxFilter === t}">${t === "all" ? "All" : t} (${t === "all" ? items.length : items.filter(i => i.type === t).length})</button>`).join("")}</div>
  <section class="panel"><div class="card-stack">
  ${shown.map(i => { const own = (i.maker === "you-maker" && state.role === "maker") || (i.maker === "sara" && state.role === "maker"); return `<article class="appr">
    <div class="appr-top"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill info">${i.type}</span>${i.maker === "ai" ? '<span class="pill ai">AI agent</span>' : `<span class="pill neutral">${nameOf(i.maker)}</span>`}</div><span class="money">${fmt(i.amount)}</span></div>

    <div class="table-wrap"><table class="cmp"><thead><tr><th>Field · expected</th><th>Sent</th><th>Status</th></tr></thead><tbody>${rows.map(r => `<tr><td><span class="num">${r[0]}</span><br><span class="small muted">${r[1]}</span></td><td class="small">${r[2]}</td><td>${r[3] === "Match" ? '<span class="pill ok">Match</span>' : '<span class="pill bad">Missing</span>'}</td></tr>`).join("")}</tbody></table></div>
    <div class="actions"><button class="btn" type="button" data-fix="require_contact">Simulate a fix</button><button class="btn secondary" type="button" data-go="traces">Open trace</button></div></div>`;
}
function viewMap() {
  return `
  <div class="page-head"><div><p class="eyebrow">Operations / Agent map</p><h1>Agent map</h1><p class="muted">Live handoffs between agents and controls. Line width is volume; labels show handoffs and acceptance. Dashed nodes need an ERP connector.</p></div>
    <div class="filters" role="group" aria-label="Filter map">${["All", "Failures", "Slow", "High cost", "Loops", "Stuck"].map((f, i) => `<button class="chip" type="button" aria-pressed="${i === 0}">${f}</button>`).join("")}</div></div>
  <div class="split map-split">
    <section class="panel">${agentMap(false)}
      <div class="stream" aria-label="Live handoff stream"><div><span>08:02:14</span><b>Collections → Outbox</b><span>rejected · contact_id missing</span></div><div><span>08:01:57</span><b>Cash application → Approval</b><span>INV-23302 · AED 44,000.00 · exact</span></div><div><span>08:01:40</span><b>Approval → Posting</b><span>policy · journal posted</span></div></div></section>
    <section class="panel" aria-live="polite">${edgeDrawer()}</section>
  </div>`;
}
function viewTraces() {
  const steps = [["08:02:01", "", "Run started · Collections agent · scheduled 08:00 GST", ""], ["08:02:03", "tool", "list_invoices(filter: overdue)", "140 ms"], ["08:02:04", "ok", "6 overdue invoices returned", ""], ["08:02:09", "tool", "propose_collection_message · Al Noor Building Materials", "210 ms"], ["08:02:09", "ok", "Outbox entry created · awaiting approval", ""], ["08:02:12", "tool", "propose_collection_message · Desert Rose Clinics", "95 ms"], ["08:02:12", "bad", "Rejected: contact_id required (1 of 3)", ""], ["08:02:14", "bad", "Rejected: contact_id required (3 of 3) · INC-104 opened", ""], ["08:02:20", "", "Finding recorded: Desert Rose Clinics has no AR contact", ""], ["09:14:40", "hum", "Omar Khalid approved and sent the Al Noor email · Resend re_7Hk2…", ""]];
  return `
  <div class="page-head"><div><p class="eyebrow">Operations / Traces</p><h1>Trace · Collections run 15/10 08:00</h1><p class="muted">One run end to end, including the human approval and the send.</p></div><span class="pill warn">Completed with incident</span></div>
  <section class="panel"><ol class="trace">${steps.map(([t, k, d, ms]) => `<li><span class="t">${t}</span><span class="k ${k}" aria-hidden="true"></span><span>${d}</span><span class="small muted num">${ms}</span></li>`).join("")}</ol></section>`;
}
function viewIncidents() {
  return `
  <div class="page-head"><div><p class="eyebrow">Operations / Incidents</p><h1>Incidents</h1><p class="muted">Detected automatically from recorded runs: handoff rejections, loops, stuck runs, failed sends, refusals and limit hits.</p></div></div>
  <section class="kpis"><div class="kpi"><span class="muted small">Open</span><span class="value">2</span><span class="note">1 critical</span></div><div class="kpi"><span class="muted small">Time to detect</span><span class="value">14 s</span><span class="note">median, 7 days</span></div><div class="kpi"><span class="muted small">Time to resolve</span><span class="value">5h 20m</span><span class="note">median, 7 days</span></div><div class="kpi"><span class="muted small">Wasted model cost</span><span class="value">USD 0.1230</span><span class="note">on failed or looping calls</span></div></section>
  <section class="panel"><div class="table-wrap"><table><thead><tr><th>Incident</th><th>Agent · kind</th><th class="r">Runs</th><th class="r">Cost USD</th><th>Fix stage</th><th></th></tr></thead><tbody>
    ${incidents.map(i => `<tr><td>${sevPill(i.sev)} <b>${i.title}</b><div class="small muted">${i.id} · ${i.since} ago</div></td><td>${i.agent}<div class="small muted">${i.kind}</div></td><td class="r num">${i.runs}</td><td class="r num">${i.cost}</td><td class="small">${i.stage}</td><td class="r"><button class="btn secondary" type="button" data-investigate="${i.edge}">Investigate</button></td></tr>`).join("")}
  </tbody></table></div></section>`;
}
function viewGuardrails() {
  const kinds = { require_contact: "Require an AR contact before proposing an email", max_amount: "Block auto-post above an AED amount", max_identical_calls: "Limit identical tool calls per run", require_field: "Require a field on a handoff", deny_tool: "Deny a tool for an agent" };
  const step = state.gStep;
  return `
  <div class="page-head"><div><p class="eyebrow">Operations / Guardrails</p><h1>Guardrails</h1><p class="muted">Rules enforced before every tool call and again in the database. New rules start in Monitor and move to Warn and Block with an independent approval.</p></div></div>
  <div class="split">
    <section class="panel" aria-labelledby="gw-h"><div class="panel-head"><h2 id="gw-h">Simulate a fix</h2></div>
      <div class="steps" aria-label="Progress"><span ${step === 1 ? 'aria-current="step"' : ""}>1 · Define</span><span ${step === 2 ? 'aria-current="step"' : ""}>2 · Simulate</span><span ${step === 3 ? 'aria-current="step"' : ""}>3 · Review & create</span></div>
      <div class="drawer">
        ${step === 1 ? `<label class="f">Rule<select id="g-kind">${Object.entries(kinds).map(([k, l]) => `<option value="${k}" ${state.gKind === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
          <label class="f">Applies to<select id="g-scope"><option>Collections agent</option><option>All agents</option><option>Dubai Operations LLC only</option></select></label>
          <p class="small muted">Evaluation order is fixed: deny tool, amount limits, required fields, identical-call limits.</p>
          <div class="actions"><button class="btn" type="button" data-gstep="2">Simulate on last 30 days</button></div>` : ""}
        ${step === 2 ? `<p class="muted">Replayed against 214 recorded tool calls from 30 days of runs. No model calls were made.</p>
          <div class="sim"><div><span class="small muted">Failures it would have caught</span><b>7 / 7</b></div><div><span class="small muted">False positives</span><b>0</b></div><div><span class="small muted">Model cost avoided</span><b>USD 0.2140</b></div></div>
          <div class="actions"><button class="btn secondary" type="button" data-gstep="1">Back</button><button class="btn" type="button" data-gstep="3">Continue</button></div>` : ""}
        ${step === 3 ? `<p><b>${kinds[state.gKind]}</b> · Collections agent</p><p class="small muted">Creates the rule in Monitor. The simulation snapshot is saved with it, so the approver sees the same evidence.</p>
          <div class="actions"><button class="btn secondary" type="button" data-gstep="2">Back</button><button class="btn" type="button" id="g-create">Create in Monitor</button></div>` : ""}
      </div></section>
    <section class="panel" aria-labelledby="gt-h"><div class="panel-head"><h2 id="gt-h">Tracked guardrails</h2></div>
      <div class="list">${guardrails.map(g => `<div class="list-row"><div><b>${g.name}</b><div class="small muted">Caught ${g.caught} · proposed by ${g.maker}</div><div class="stage-track" style="margin-top:6px">${["monitor", "warn", "block"].map(st => `<span class="${g.stage === st ? "on" : ""}">${st[0].toUpperCase() + st.slice(1)}</span>`).join("")}</div><div class="small muted" style="margin-top:4px">${g.history.join(" → ")}</div></div>
        <div class="actions">${stagePill(g.stage)}${g.stage !== "block" ? (state.role === "approver" ? `<button class="btn secondary" type="button" data-promote="${g.id}">Promote</button>` : `<span class="small muted">An AR manager promotes</span>`) : ""}<button class="btn ghost" type="button" data-rollback="${g.id}">Roll back</button></div></div>`).join("")}</div></section>
  </div>`;
}
function viewInsights() {
  return `
  <div class="page-head"><div><p class="eyebrow">Operations / Insights</p><h1>Insights</h1><p class="muted">Where time and model cost go, and what to change.</p></div></div>
  <div class="split">
    <section class="panel"><div class="panel-head"><h2>Slowest tools</h2><span class="small muted">p50 · 7 days</span></div>
      <div class="bars">${[["get_ar_kpi_pack", 640], ["list_invoices", 180], ["get_cash_match_candidates", 150], ["propose_receipt", 90]].map(([n, v]) => `<div class="bar-row"><span class="num" style="font-size:12px">${n}</span><span class="bar-track"><span style="width:${(v / 640 * 100).toFixed(0)}%"></span></span><span class="num" style="text-align:end">${v} ms</span></div>`).join("")}</div></section>
    <section class="panel"><div class="panel-head"><h2>Suggestions</h2><span class="pill ai">Reporting agent</span></div>
      <div class="list"><div class="list-row"><div><b>Add AR contacts for 4 customers</b><div class="small muted">They block collections drafts and caused INC-104. Source: 7 rejected handoffs.</div></div><button class="btn ghost" type="button" data-go="customer">Open customers</button></div>
        <div class="list-row"><div><b>Raise the daily auto-post limit to AED 75,000.00</b><div class="small muted">The limit was reached on 4 of the last 7 days; all 38 policy postings were exact matches with no reversals.</div></div><button class="btn ghost" type="button" data-go="agents">Review policy</button></div></div></section>
  </div>`;
}
function dock() {
  return state.dock ? `<div class="dock" role="dialog" aria-label="Copilot"><div class="dock-head"><b>Copilot</b><button class="btn ghost" type="button" data-dock="close" aria-label="Close copilot">✕</button></div>
    <div class="dock-body"><p class="bubble ai" style="max-width:none">2 open incidents. The critical one is a missing AR contact for Desert Rose Clinics. Want me to explain INC-104 or forecast this week's model cost?</p>
    <div class="followups"><button class="chip" type="button" data-investigate="col-out">Explain INC-104</button><button class="chip" type="button" data-toast="Projected model cost this week: USD 4.62 at the current run rate.">Cost forecast</button><button class="chip" type="button" data-fix="require_contact">Draft a fix</button></div></div></div>` : "";
}

function render() {
  nav();
  const v = state.view;
  document.getElementById("dock-host").innerHTML = `<button class="btn dock-btn" type="button" data-dock="toggle" aria-expanded="${state.dock}">${icon("chat")}Copilot</button>${dock()}`;
  document.getElementById("view").innerHTML = v === "ops" ? viewOps() : v === "map" ? viewMap() : v === "traces" ? viewTraces() : v === "incidents" ? viewIncidents() : v === "guardrails" ? viewGuardrails() : v === "insights" ? viewInsights() : v === "collections" ? viewCollections() : v === "inbox" ? viewInbox() : v === "customer" ? viewCustomer() : v === "agents" ? viewAgents() : v === "copilot" ? viewCopilot()
    : v === "overview" ? viewSimple("Overview", "Home / Overview", "KPIs, charts and countback DSO from slice 1.") : v === "cash" ? viewSimple("Cash application", "Work / Cash application", "Bank credits, receipts and allocations.")
    : v === "reports" ? viewSimple("Reports", "Insight / Reports", "AR pack with DSO, CEI and aging.") : viewSimple("Receivables ledger", "Records / Receivables ledger", "Every invoice with lifecycle, dispute and collection status.");
}

// ---- Interactions ----
document.addEventListener("click", (e) => {
  const hit = e.target.closest("[data-edge]");
  if (hit) { state.edge = hit.dataset.edge; render(); return; }
  const t = e.target.closest("button, tr[data-select]"); if (!t) return;
  if (t.dataset.investigate) { state.edge = t.dataset.investigate; state.view = "map"; state.dock = false; render(); return; }
  if (t.dataset.fix) { state.gKind = t.dataset.fix; state.gStep = 1; state.view = "guardrails"; state.dock = false; render(); return; }
  if (t.dataset.gstep) { const k = document.getElementById("g-kind"); if (k) state.gKind = k.value; state.gStep = Number(t.dataset.gstep); render(); return; }
  if (t.id === "g-create") { guardrails.unshift({ id: "g" + (guardrails.length + 1), name: { require_contact: "Require an AR contact before proposing an email", max_amount: "Block auto-post above an AED amount", max_identical_calls: "Limit identical tool calls per run", require_field: "Require a field on a handoff", deny_tool: "Deny a tool for an agent" }[state.gKind], kind: state.gKind, stage: "monitor", maker: state.role === "maker" ? "Sara (controller)" : "Omar (AR manager)", caught: 0, history: ["Monitor 16/10"] }); state.gStep = 1; render(); toast("Created in Monitor. It records matches without blocking."); return; }
  if (t.dataset.promote) { const g = guardrails.find(x => x.id === t.dataset.promote); const next = g.stage === "monitor" ? "warn" : "block"; g.stage = next; g.history.push(`${next[0].toUpperCase() + next.slice(1)} 16/10`); render(); toast(`Promoted to ${next}. Recorded with you as the checker.`); return; }
  if (t.dataset.rollback) { const g = guardrails.find(x => x.id === t.dataset.rollback); g.stage = "rolled_back"; g.history.push("Rolled back 16/10"); render(); toast("Rolled back. The previous version stays in history."); return; }
  if (t.dataset.dock) { state.dock = t.dataset.dock === "toggle" ? !state.dock : false; render(); return; }
  if (t.dataset.go) { state.view = t.dataset.go; render(); document.getElementById("view").focus(); return; }
  if (t.dataset.select) { state.selected = t.dataset.select; state.submitted = outbox.some(m => m.cust === state.selected); render(); return; }
  if (t.dataset.tone) { state.tone = t.dataset.tone; render(); return; }
  if (t.dataset.obtab) { state.outboxTab = t.dataset.obtab; render(); return; }
  if (t.dataset.ctab) { state.custTab = t.dataset.ctab; render(); return; }
  if (t.dataset.filter) { state.inboxFilter = t.dataset.filter; render(); return; }
  if (t.dataset.toast) { toast(t.dataset.toast); return; }
  if (t.id === "role-maker" || t.id === "role-approver") { state.role = t.id === "role-maker" ? "maker" : "approver"; document.getElementById("role-maker").setAttribute("aria-pressed", state.role === "maker"); document.getElementById("role-approver").setAttribute("aria-pressed", state.role === "approver"); render(); toast(state.role === "maker" ? "Viewing as credit controller (maker)." : "Viewing as AR manager (approver)."); return; }
  if (t.id === "submit-draft") {
    const c = customers.find(x => x.id === state.selected);
    const lines = c.invoices.filter(i => /Overdue/.test(i[3]) && !/Dispute/.test(i[4]));
    const total = (lines.reduce((s, i) => s + Math.round(parseFloat(i[2]) * 100), 0) / 100).toFixed(2);
    outbox.push({ id: "m" + (outbox.length + 1), cust: c.id, to: c.contacts[0].email, subject: `${state.tone === "final_notice" ? "Final notice" : "Payment reminder"}: ${c.acct} overdue ${fmt(total)}`, amount: total, maker: "you-maker", status: "pending", lines: lines.map(i => i[0]).join(", "), attach: document.getElementById("attach-soa")?.checked });
    state.submitted = true; state.outboxTab = "pending"; render(); toast("Submitted to the outbox. An AR manager must approve before anything is sent."); return;
  }
  if (t.dataset.approve || t.dataset.reject) {
    const id = t.dataset.approve || t.dataset.reject; const ack = document.querySelector(`[data-ack="${id}"]`);
    if (t.dataset.approve && ack && !ack.checked) { toast("Tick the review confirmation first."); ack.focus(); return; }
    const m = outbox.find(x => x.id === id); const a = approvals.find(x => x.id === id);
    if (id === "h1") { state.holdReleased = !!t.dataset.approve; render(); toast(t.dataset.approve ? "Hold released. Recorded in the customer timeline." : "Release rejected."); return; }
    if (m) { if (t.dataset.reject) { m.status = "failed"; m.providerId = ""; render(); toast("Rejected. The maker sees your decision in the outbox."); return; }
      m.status = "approved"; render(); toast("Approved. Sending through Resend…");
      setTimeout(() => { m.status = "sent"; m.providerId = "re_7Hk2" + m.id; render(); toast("Sent. Resend confirmed delivery to the provider."); }, 1200); return; }
    if (a) { a.status = t.dataset.approve ? "approved" : "rejected"; render(); toast(t.dataset.approve ? (a.type === "Cash" ? "Approved. Posting runs as a separate step." : "Approved and recorded.") : "Rejected and recorded."); }
  }
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-select]")) { e.preventDefault(); e.target.click(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-edge]")) { e.preventDefault(); state.edge = e.target.dataset.edge; render(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmdk(); }
  if (e.key === "Escape") { document.getElementById("modal-host").innerHTML = ""; if (state.dock) { state.dock = false; render(); } }
});
document.addEventListener("change", (e) => { if (e.target.id === "cust-pick") { state.selected = e.target.value; render(); } });
function openCmdk() {
  const host = document.getElementById("modal-host");
  const rows = [["ops","Go to Agent operations","pulse"],["incidents","Go to Incidents","bell"],["collections","Go to Collections","coll"],["inbox","Go to Approvals","inbox"],["customer","Al Noor Building Materials · CUS-1042","cust"],["customer","Marina Hospitality Group · CUS-0877","cust"],["copilot","Ask Copilot: who should I call first?","chat"],["agents","Run collections agent","bot"]];
  host.innerHTML = `<div class="modal-scrim" data-close><div class="modal" role="dialog" aria-modal="true" aria-label="Command bar"><input id="cmdk-input" placeholder="Search or type a command" autocomplete="off"><div id="cmdk-list">${rows.map(([go, l, ic]) => `<button type="button" class="cmd-row" data-go="${go}">${icon(ic)}${l}</button>`).join("")}</div></div></div>`;
  const input = document.getElementById("cmdk-input"); input.focus();
  input.addEventListener("input", () => { const q = input.value.toLowerCase(); document.querySelectorAll(".cmd-row").forEach(r => r.hidden = !r.textContent.toLowerCase().includes(q)); });
  host.querySelector("[data-close]").addEventListener("click", (e) => { if (e.target === e.currentTarget || e.target.closest(".cmd-row")) host.innerHTML = ""; });
}
document.getElementById("open-cmdk").addEventListener("click", openCmdk);
render();
})();
</script>
