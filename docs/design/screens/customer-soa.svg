 <g aria-label="Reconciliation and source completeness"><rect x="272" y="774" width="1136" height="90" rx="14" fill="#FFF4DC"/><text x="292" y="801" fill="#865410" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="start">Reconciliation and source completeness</text><text x="292" y="825" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">Opening balance + valid debit movements − valid credit movements = closing balance. Show unapplied cash separately and avoid counting a receipt again as its allocation.</text></g>
