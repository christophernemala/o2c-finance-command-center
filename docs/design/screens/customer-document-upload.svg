 <text x="300" y="780" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">Versioned documents stay linked to the same customer ID. A failed or</text><text x="300" y="799.8" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">quarantined upload remains explicit.</text></g>
