<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Mobile customer account</title><desc id="desc">Editable light mobile O2C account design, all identity and financial facts unavailable.</desc>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#F6F7FB"/>
<g id="mobile-header"><rect x="0" y="0" width="390" height="88" rx="0" fill="#FFFFFF"/><text x="20" y="32" fill="#202635" font-family="Sora,sans-serif" font-size="20" font-weight="600" text-anchor="start">O2C</text><text x="370" y="31" fill="#5654D6" font-family="Inter,sans-serif" font-size="12" font-weight="500" text-anchor="end">Customers</text><text x="20" y="64" fill="#626C80" font-family="Inter,sans-serif" font-size="11" font-weight="400" text-anchor="start">Company / entity not selected</text></g>
<g id="mobile-account-heading"><text x="20" y="126" fill="#202635" font-family="Sora,sans-serif" font-size="23" font-weight="600" text-anchor="start">Customer account</text><text x="20" y="155" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">One account. All customer records.</text><rect x="20" y="176" width="199" height="26" rx="13" fill="#EEEEFF"/><text x="119.5" y="193" fill="#5654D6" font-family="Inter,sans-serif" font-size="11" font-weight="500" text-anchor="middle">REQUESTED PRODUCT DESIGN</text></g>
<g aria-label="Select a customer"><rect x="20" y="221" width="350" height="90" rx="14" fill="#EEEEFF"/><text x="40" y="248" fill="#5654D6" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="start">Select a customer</text><text x="40" y="272" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">Identity and balances are unavailable until an</text><text x="40" y="291.8" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">authorized account is selected.</text></g>
<g id="mobile-tabs"><rect x="20" y="331" width="350" height="48" rx="12" fill="#FFFFFF" stroke="#E4E7EF"/><rect x="28" y="342" width="98" height="26" rx="13" fill="#EEEEFF"/><text x="77" y="359" fill="#5654D6" font-family="Inter,sans-serif" font-size="11" font-weight="500" text-anchor="middle">Invoices</text><text x="151" y="359" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">SOA</text><text x="239" y="359" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">Documents</text></g>
<g aria-label="Outstanding AED"><rect x="20" y="399" width="168" height="100" rx="14" fill="#FFFFFF" stroke="#E4E7EF"/><text x="40" y="427" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">Outstanding AED</text><text x="40" y="459" fill="#202635" font-family="JetBrains Mono,sans-serif" font-size="26" font-weight="500" text-anchor="start">—</text><text x="40" y="483" fill="#626C80" font-family="Inter,sans-serif" font-size="11" font-weight="400" text-anchor="start">Source unavailable</text></g><g aria-label="Applied receipts"><rect x="202" y="399" width="168" height="100" rx="14" fill="#FFFFFF" stroke="#E4E7EF"/><text x="222" y="427" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">Applied receipts</text><text x="222" y="459" fill="#202635" font-family="JetBrains Mono,sans-serif" font-size="26" font-weight="500" text-anchor="start">—</text><text x="222" y="483" fill="#626C80" font-family="Inter,sans-serif" font-size="11" font-weight="400" text-anchor="start">Source unavailable</text></g>
<g id="mobile-invoices"><rect x="20" y="519" width="350" height="175" rx="18" fill="#FFFFFF" stroke="#E4E7EF"/><text x="195" y="570" fill="#202635" font-family="Sora,sans-serif" font-size="16" font-weight="600" text-anchor="middle">No invoices available</text><text x="195" y="600" fill="#626C80" font-family="Inter,sans-serif" font-size="11" font-weight="400" text-anchor="middle">Choose a customer with verified records.</text><g aria-label="Choose customer"><rect x="40" y="626" width="310" height="44" rx="12" fill="#5654D6" stroke="#5654D6"/><text x="195" y="653" fill="#FFFFFF" font-family="Inter,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Choose customer</text></g></g>
<text x="20" y="725" fill="#626C80" font-family="Inter,sans-serif" font-size="11" font-weight="400" text-anchor="start">Original invoices, full statements and</text><text x="20" y="743.15" fill="#626C80" font-family="Inter,sans-serif" font-size="11" font-weight="400" text-anchor="start">versioned documents stay linked to the same</text><text x="20" y="761.3" fill="#626C80" font-family="Inter,sans-serif" font-size="11" font-weight="400" text-anchor="start">scoped account.</text>
<path d="M20 790H370" stroke="#E4E7EF"/><text x="195" y="819" fill="#626C80" font-family="Inter,sans-serif" font-size="10" font-weight="400" text-anchor="middle">Private cloud records · authorized access</text></svg>