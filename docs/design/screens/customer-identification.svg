 </g>
 <g id="identity-exceptions"><rect x="1008" y="284" width="400" height="605" rx="18" fill="#FFFFFF" stroke="#E4E7EF"/><text x="1032" y="323" fill="#202635" font-family="Sora,sans-serif" font-size="17" font-weight="600" text-anchor="start">Identification mechanism</text>
 <rect x="1032" y="353" width="352" height="48" rx="10" fill="#F1F2F8"/><text x="1048" y="382" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">1  Resolve authorized company/entity</text><rect x="1032" y="419" width="352" height="48" rx="10" fill="#F1F2F8"/><text x="1048" y="448" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">2  Match exact source account code</text><rect x="1032" y="485" width="352" height="48" rx="10" fill="#F1F2F8"/><text x="1048" y="514" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">3  Review conflicting external IDs</text><rect x="1032" y="551" width="352" height="48" rx="10" fill="#F1F2F8"/><text x="1048" y="580" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">4  Retain stable customer identity</text>
 <g aria-label="Do not merge by name"><rect x="1032" y="637" width="352" height="90" rx="14" fill="#FFF4DC"/><text x="1052" y="664" fill="#865410" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="start">Do not merge by name</text><text x="1052" y="688" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">Similar names or shared emails are supporting</text><text x="1052" y="707.8" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">evidence, never automatic identity.</text></g>
 <text x="1032" y="773" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">An internal customer account is not a</text><text x="1032" y="792.8" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">customer login. External portal access needs</text><text x="1032" y="812.6" fill="#626C80" font-family="Inter,sans-serif" font-size="12" font-weight="400" text-anchor="start">its own scoped authorization.</text>
 </g></g>
